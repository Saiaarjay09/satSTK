# On a version tag (for example v0.2.0): run the tests, then publish a GitHub Release with one source zip.
# satSTK is pure Python, so the download is the source, tests, README and launcher; the README explains the three setup commands.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          mkdir -p dist "stage/satSTK-$V"
          cp -r *.py ui data tests docs requirements.txt requirements-dev.txt run.sh README.md RELEASE_NOTES.md "stage/satSTK-$V/"
          (cd stage && zip -qr "../dist/satSTK-$V.zip" "satSTK-$V")
          unzip -l "dist/satSTK-$V.zip" | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: satstk-download
          path: dist/*.zip
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: satstk-download
          path: dist
      - name: Publish the release (replacing any earlier release for this tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "satSTK ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
