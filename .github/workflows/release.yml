# On a version tag (for example v0.1.0): run the tests, then publish a GitHub Release with one download for Windows and one for macOS.
# The script is pure Python, so each download is a zip of the script, its tests, the README and the launcher for that system.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python setu_stk.py --offline-preview

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the two downloads
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          common="setu_stk.py requirements.txt README.md tests"
          mkdir -p dist
          rm -rf stage && mkdir -p "stage/Setu-STK-$V-windows" && cp -r $common run_windows.bat "stage/Setu-STK-$V-windows/"
          rm -rf stage2 && mkdir -p "stage2/Setu-STK-$V-macos" && cp -r $common run_preview_mac.command "stage2/Setu-STK-$V-macos/"
          (cd stage && zip -qr "../dist/Setu-STK-$V-windows.zip" "Setu-STK-$V-windows")
          (cd stage2 && zip -qr "../dist/Setu-STK-$V-macos.zip" "Setu-STK-$V-macos")
          unzip -l "dist/Setu-STK-$V-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: setu-downloads
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: setu-downloads
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Setu-STK ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
